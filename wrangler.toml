name = "anonx-bot"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Secrets are NOT stored here — use `wrangler secret put` or GitHub secrets.
# The following are placeholders so wrangler doesn't complain:
[vars]
BOT_NAME = "AnonX"
MULTI_ANON = "true"
ANON_SHUFFLE_MODE = "false"
TOPIC_END_IDLE_MINUTES = "10"