name: Piko music player validation

on:
  push:
    branches:
      - fix/piko-group-call-player
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile main.py generate_string_session.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: |
          node --input-type=module --check < src/piko.js
          node --input-type=module --check < src/handlers.js
